[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nocpro"
version = "0.1.0"
description = "NOCPro Pilot - NOC Operations Platform (Documentation + Pilot v0.1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "NOCPro Team" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.30,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "structlog>=24.4,<25.0",
    "httpx>=0.27,<1.0",
    "tenacity>=9.0,<10.0",
    "python-multipart>=0.0.9,<1.0",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT[crypto]>=2.9.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[project.urls]
Repository = "https://github.com/parsgan/NOCPro"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
NOCPro = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests requiring services",
    "e2e: end-to-end tests",
    "security: security-related tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["NOCPro"]
